name: Update Docker image for Debian Package builds

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 3am
  workflow_dispatch:        # manual rebuild when you need it

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/debian-builder

jobs:
  rebuild-docker-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # this is what allows pushing to ghcr.io

    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4  # needed for registry cache
        with:
          buildkitd-flags: --debug

      - uses: docker/metadata-action@v6      # generates tags cleanly
        id: meta
        with:
          images: ${{ env.IMAGE}}

      - uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          #docker/xxx .builder
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          #    tags: |
          #      ghcr.io/michal-maruska/debian-builder:latest
          #      ghcr.io/michal-maruska/debian-builder:${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.IMAGE}}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE}}:buildcache,mode=max

  discover-runners:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        name: Discover online runners
        run: |
          nodes=$(gh api orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status=="online" and .busy==false) | .labels[].name] | unique')
          echo "matrix={\"node\":$nodes}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

  rebuild-debspawn-arm64:
    needs: discover-runners
    if: needs.discover-runners.outputs.matrix != '{"node":[]}'
    strategy:
      matrix: ${{ fromJson(needs.discover-runners.outputs.matrix) }}
    runs-on: [self-hosted, arm64, "${{ matrix.node }}"]
    steps:
      - name: Update debspawn sid chroot
        run: |
          sudo debspawn update sid

  watchdog:
    runs-on: ubuntu-latest
    needs: discover-runners
    steps:
      - run: |
          sleep 600  # your timeout, e.g. 10 min
          # find jobs still queued for this run and cancel them
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.status=="queued") | .run_id' | \
            xargs -I{} gh api -X POST repos/${{ github.repository }}/actions/runs/{}/cancel
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

